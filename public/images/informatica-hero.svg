<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="none"/>
  
  <!-- Central computer tower -->
  <rect x="140" y="80" width="120" height="140" rx="8" fill="url(#grad1)" stroke="#111827" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="160" y="100" width="80" height="60" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="200" cy="130" r="15" fill="#06b6d4" opacity="0.3"/>
  
  <!-- Ports on side -->
  <rect x="150" y="120" width="8" height="8" fill="#06b6d4"/>
  <rect x="150" y="135" width="8" height="8" fill="#06b6d4"/>
  <rect x="150" y="150" width="8" height="8" fill="#06b6d4"/>
  
  <!-- Power button -->
  <circle cx="200" cy="190" r="6" fill="#10b981" stroke="#06b6d4" stroke-width="1.5"/>
  
  <!-- Network connections -->
  <line x1="80" y1="150" x2="140" y2="150" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="260" y1="150" x2="320" y2="150" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Connection nodes -->
  <circle cx="80" cy="150" r="5" fill="#3b82f6"/>
  <circle cx="320" cy="150" r="5" fill="#3b82f6"/>
  
  <!-- Data symbols -->
  <g opacity="0.6">
    <path d="M 70 130 Q 75 125 80 130" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <path d="M 330 130 Q 325 125 320 130" stroke="#06b6d4" stroke-width="2" fill="none"/>
  </g>
</svg>