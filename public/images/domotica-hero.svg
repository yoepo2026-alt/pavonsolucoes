<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="none"/>
  
  <!-- House outline -->
  <path d="M 100 200 L 200 100 L 300 200 L 300 250 L 100 250 Z" fill="none" stroke="url(#grad2)" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="185" y="200" width="30" height="50" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="212" cy="225" r="2" fill="#fbbf24"/>
  
  <!-- Windows -->
  <rect x="125" y="140" width="30" height="30" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <line x1="140" y1="140" x2="140" y2="170" stroke="#06b6d4" stroke-width="0.5"/>
  <line x1="125" y1="155" x2="155" y2="155" stroke="#06b6d4" stroke-width="0.5"/>
  
  <rect x="245" y="140" width="30" height="30" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <line x1="260" y1="140" x2="260" y2="170" stroke="#06b6d4" stroke-width="0.5"/>
  <line x1="245" y1="155" x2="275" y2="155" stroke="#06b6d4" stroke-width="0.5"/>
  
  <!-- Smart home symbols - light bulbs -->
  <circle cx="130" cy="155" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="260" cy="155" r="4" fill="#fbbf24" opacity="0.8"/>
  
  <!-- WiFi symbol -->
  <path d="M 200 260 Q 190 250 180 245" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M 200 260 Q 190 247 180 240" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <path d="M 200 260 Q 210 250 220 245" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M 200 260 Q 210 247 220 240" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="260" r="2" fill="#06b6d4"/>
  
  <!-- Temperature indicator -->
  <circle cx="140" cy="100" r="8" fill="none" stroke="#f97316" stroke-width="1.5"/>
  <line x1="140" y1="108" x2="140" y2="93" stroke="#f97316" stroke-width="1"/>
  
  <!-- Security camera -->
  <circle cx="290" cy="110" r="6" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="290" cy="110" r="3" fill="#ec4899"/>
</svg>