<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central hub -->
  <circle cx="200" cy="150" r="30" fill="url(#grad5)" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="200" cy="150" r="20" fill="#1e293b"/>
  <circle cx="200" cy="150" r="8" fill="#06b6d4"/>
  
  <!-- Connected nodes -->
  <g opacity="0.6">
    <!-- Top left -->
    <circle cx="100" cy="80" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="115" y1="95" x2="185" y2="135" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Top right -->
    <circle cx="300" cy="80" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="285" y1="95" x2="215" y2="135" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Bottom left -->
    <circle cx="80" cy="220" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="95" y1="205" x2="185" y2="165" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Bottom right -->
    <circle cx="320" cy="220" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="305" y1="205" x2="215" y2="165" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Device icons in nodes -->
  <g fill="#06b6d4" font-size="20">
    <text x="95" y="85">📱</text>
    <text x="295" y="85">💻</text>
    <text x="70" y="225">🏠</text>
    <text x="315" y="225">⚙️</text>
  </g>
</svg>