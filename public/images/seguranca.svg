<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M 200 60 L 280 100 L 280 180 Q 280 220 200 250 Q 120 220 120 180 L 120 100 Z" fill="url(#grad4)" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>
  <path d="M 200 60 L 280 100 L 280 180 Q 280 220 200 250 Q 120 220 120 180 L 120 100 Z" fill="none" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Lock symbol -->
  <g transform="translate(200, 140)">
    <!-- Shackle -->
    <path d="M -20 0 Q -20 -25 0 -25 Q 20 -25 20 0" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body -->
    <rect x="-20" y="0" width="40" height="35" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="3" fill="#06b6d4"/>
    <rect x="-1" y="15" width="2" height="8" fill="#06b6d4"/>
  </g>
  
  <!-- Checkmark -->
  <g opacity="0.8">
    <circle cx="290" cy="110" r="20" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 280 115 L 288 123 L 300 105" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>